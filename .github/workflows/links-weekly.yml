name: Weekly external link check

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --exclude-mail
            --exclude-loopback
            --accept 200,206,301,302,429
            "./*.html"
            "./demo-*/index.html"
          fail: true
